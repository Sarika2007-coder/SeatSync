<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – SeatSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">🚌 Seat<span>Sync</span></div>
    <h2>Admin Portal</h2>
    <p class="auth-sub">Sign in with your administrator credentials</p>

    <div id="adminMsg" class="auth-message" style="display:none;"></div>

    <form onsubmit="adminLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="adminUsername" class="form-control" placeholder="Admin username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="adminPassword" class="form-control" placeholder="Admin password" required autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-full" id="adminBtn">Sign In as Admin</button>
    </form>

    <a href="index.html" class="auth-back">← Back to Home</a>
  </div>
</div>

<script>
  function togglePw() {
    const el = document.getElementById('adminPassword');
    const btn = document.querySelector('.toggle-pw');
    if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
    else { el.type = 'password'; btn.textContent = '👁'; }
  }
</script>
<script src="js/login.js" defer></script>
</body>
</html>
