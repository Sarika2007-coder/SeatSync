<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Admins - SeatSync</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/superadmin.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="auth-logo">
            Seat<span>Sync</span>
        </div>

        <h3>Super Admin</h3>

        <nav>
            <a href="superadmin-dashboard.html">🏠 Dashboard</a>
            <a href="manage-admins.html">👨‍💼 Manage Admins</a>
            <a href="manage-users.html">👥 Manage Users</a>
            <a href="manage-buses.html">🚌 Manage Buses</a>
            <a href="manage-routes.html">🛣️ Manage Routes</a>
            <a href="manage-bookings.html">🎟️ Manage Bookings</a>
            <a href="revenue.html">💰 Revenue</a>
            <a href="activity-logs.html">📋 Activity Logs</a>
        </nav>

        <button onclick="logout()" class="btn-full">
            Logout
        </button>

    </aside>


    <!-- Main Content -->
    <main class="dashboard-content">

        <div class="dashboard-header">

            <h1>Manage Admins</h1>

            <p>
                Add, view and manage SeatSync administrators.
            </p>

        </div>


        <!-- Add Admin -->
        <section class="dashboard-section">

            <h2>Add New Admin</h2>

            <form id="addAdminForm">

                <div class="form-group">

                    <label for="adminName">
                        Admin Name
                    </label>

                    <input
                        type="text"
                        id="adminName"
                        class="form-control"
                        placeholder="Enter admin name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        class="form-control"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit" class="btn-full">
                    Add Admin
                </button>

            </form>

        </section>


        <!-- Admin List -->
        <section class="dashboard-section">

            <h2>Existing Admins</h2>

            <div id="adminList">

                <p>
                    No admins added yet.
                </p>

            </div>

        </section>

    </main>

</div>


<script src="js/env-config.js"></script>
<script type="module" src="js/supabase-client.js"></script>
<script type="module" src="js/superadmin.js"></script>

</body>
</html>
