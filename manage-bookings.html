<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Bookings - SeatSync</title>

    <link rel="stylesheet"
          href="css/style.css">
    <link rel="stylesheet"
          href="css/superadmin.css">

</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="auth-logo">
            Seat<span>Sync</span>
        </div>

        <h3>Super Admin</h3>

        <nav>

            <a href="superadmin-dashboard.html">
                🏠 Dashboard
            </a>

            <a href="manage-admins.html">
                👨‍💼 Manage Admins
            </a>

            <a href="manage-users.html">
                👥 Manage Users
            </a>

            <a href="manage-buses.html">
                🚌 Manage Buses
            </a>

            <a href="manage-routes.html">
                🛣️ Manage Routes
            </a>

            <a href="manage-bookings.html">
                🎟️ Manage Bookings
            </a>

            <a href="revenue.html">
                💰 Revenue
            </a>

            <a href="activity-logs.html">
                📋 Activity Logs
            </a>

        </nav>

        <button
            onclick="logout()"
            class="btn-full">

            Logout

        </button>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="dashboard-content">

        <div class="dashboard-header">

            <h1>
                Manage Bookings
            </h1>

            <p>
                View and manage all SeatSync bookings.
            </p>

        </div>


        <!-- BOOKINGS -->

        <section class="dashboard-section">

            <h2>
                Existing Bookings
            </h2>

            <div id="bookingList">

                <p>
                    Loading bookings...
                </p>

            </div>

        </section>

    </main>

</div>


<!-- SUPABASE CONFIG -->

<script src="js/env-config.js"></script>


<!-- LOAD SUPABASE + BOOKINGS -->

<script type="module">

    import {
        createClient
    }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


    // ========================================
    // SUPABASE CONFIG
    // ========================================

    const cfg =
        window.__SUPABASE_CONFIG || {};


    if (!cfg.url || !cfg.anonKey) {

        console.error(
            "Supabase configuration missing."
        );

        document.getElementById("bookingList").innerHTML = `
            <div class="alert alert-error">
                <h3>Supabase configuration missing</h3>
                <p>
                    Check your js/env-config.js file.
                </p>
            </div>
        `;

        throw new Error(
            "Supabase configuration missing"
        );

    }


    // ========================================
    // CREATE SUPABASE CLIENT
    // ========================================

    const supabase =
        createClient(
            cfg.url,
            cfg.anonKey
        );


    window.supabase =
        supabase;


    // ========================================
    // AUTH GUARD
    // ========================================

    if (
        localStorage.getItem("ss_role") !==
        "superadmin"
    ) {

        window.location.href =
            "superadmin-login.html";

        throw new Error(
            "Not authenticated"
        );

    }


    console.log(
        "Supabase initialized:",
        true
    );


    // ========================================
    // LOAD BOOKINGS
    // ========================================

    async function loadBookings() {

        const bookingList =
            document.getElementById(
                "bookingList"
            );


        bookingList.innerHTML =
            "<p>Loading bookings...</p>";


        try {

            const {
                data: bookings,
                error
            } =
                await supabase
                    .from("bookings")
                    .select("*")
                    .order(
                        "booked_at",
                        {
                            ascending: false
                        }
                    );


            // ========================================
            // SHOW ERROR
            // ========================================

            if (error) {

                console.error(
                    "Booking error:",
                    error
                );


                bookingList.innerHTML = `

                    <div class="alert alert-error">

                        <h3>
                            Unable to load bookings
                        </h3>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

                return;

            }


            // ========================================
            // CONSOLE
            // ========================================

            console.log(
                "Bookings:",
                bookings
            );


            console.log(
                "Number of bookings:",
                bookings
                    ? bookings.length
                    : 0
            );


            // ========================================
            // NO BOOKINGS
            // ========================================

            if (
                !bookings ||
                bookings.length === 0
            ) {

                bookingList.innerHTML = `

                    <div class="empty-state">

                        <div class="icon">
                            🎟️
                        </div>

                        <h3>
                            No bookings yet
                        </h3>

                        <p>
                            There are currently no bookings.
                        </p>

                    </div>

                `;

                return;

            }


            // ========================================
            // CLEAR
            // ========================================

            bookingList.innerHTML = "";


            // ========================================
            // DISPLAY BOOKINGS
            // ========================================

            bookings.forEach(
                (booking) => {


                    const bookingCard =
                        document.createElement(
                            "div"
                        );


                    bookingCard.className =
                        "bus-card";


                    bookingCard.innerHTML = `

                        <h3>
                            🎟️ Booking
                            ${booking.ref || booking.id}
                        </h3>


                        <p>
                            <strong>ID:</strong>
                            ${booking.id || "—"}
                        </p>


                        <p>
                            <strong>Reference:</strong>
                            ${booking.ref || "—"}
                        </p>


                        <p>
                            <strong>User Email:</strong>
                            ${booking.user_email || "—"}
                        </p>


                        <p>
                            <strong>Route:</strong>
                            ${booking.route || "—"}
                        </p>


                        <p>
                            <strong>Bus Name:</strong>
                            ${booking.bus_name || "—"}
                        </p>


                        <p>
                            <strong>Bus Type:</strong>
                            ${booking.bus_type || "—"}
                        </p>


                        <p>
                            <strong>Date:</strong>
                            ${booking.date || "—"}
                        </p>


                        <p>
                            <strong>Time:</strong>
                            ${booking.time || "—"}
                        </p>


                        <p>
                            <strong>Seats:</strong>
                            ${booking.seats || "—"}
                        </p>


                        <p>
                            <strong>Passengers:</strong>
                            ${booking.passengers || "—"}
                        </p>


                        <p>
                            <strong>Contact Email:</strong>
                            ${booking.contact_email || "—"}
                        </p>


                        <p>
                            <strong>Contact Phone:</strong>
                            ${booking.contact_phone || "—"}
                        </p>


                        <p>
                            <strong>Total Amount:</strong>
                            ₹${booking.total_amount || 0}
                        </p>


                        <p>
                            <strong>Tax:</strong>
                            ₹${booking.tax || 0}
                        </p>


                        <p>
                            <strong>Grand Total:</strong>
                            ₹${booking.grand_total || 0}
                        </p>


                        <p>
                            <strong>Payment Method:</strong>
                            ${booking.payment_method || "—"}
                        </p>


                        <p>
                            <strong>Status:</strong>
                            ${booking.status || "—"}
                        </p>


                        <p>
                            <strong>Booked At:</strong>
                            ${
                                booking.booked_at
                                    ? new Date(
                                        booking.booked_at
                                      ).toLocaleString()
                                    : "—"
                            }
                        </p>


                        <div class="bus-actions">

                            <button
                                class="edit-booking-btn"
                                data-id="${booking.id}">

                                Edit Status

                            </button>


                            <button
                                class="delete-booking-btn"
                                data-id="${booking.id}">

                                Delete

                            </button>

                        </div>

                    `;


                    bookingList.appendChild(
                        bookingCard
                    );

                }
            );


            // ========================================
            // EDIT STATUS
            // ========================================

            document
                .querySelectorAll(
                    ".edit-booking-btn"
                )
                .forEach(
                    (button) => {

                        button.addEventListener(
                            "click",
                            async () => {

                                const bookingId =
                                    button.dataset.id;


                                const newStatus =
                                    prompt(
                                        "Enter booking status:",
                                        "Confirmed"
                                    );


                                if (
                                    newStatus === null
                                ) {

                                    return;

                                }


                                const {
                                    error
                                } =
                                    await supabase
                                        .from(
                                            "bookings"
                                        )
                                        .update({
                                            status:
                                                newStatus.trim()
                                        })
                                        .eq(
                                            "id",
                                            bookingId
                                        );


                                if (error) {

                                    console.error(
                                        "Update error:",
                                        error
                                    );


                                    alert(
                                        "Failed to update booking.\n\n" +
                                        error.message
                                    );

                                    return;

                                }


                                alert(
                                    "Booking updated successfully!"
                                );


                                loadBookings();

                            }
                        );

                    }
                );


            // ========================================
            // DELETE BOOKING
            // ========================================

            document
                .querySelectorAll(
                    ".delete-booking-btn"
                )
                .forEach(
                    (button) => {

                        button.addEventListener(
                            "click",
                            async () => {

                                const bookingId =
                                    button.dataset.id;


                                const confirmed =
                                    confirm(
                                        "Are you sure you want to delete this booking?"
                                    );


                                if (!confirmed) {

                                    return;

                                }


                                const {
                                    error
                                } =
                                    await supabase
                                        .from(
                                            "bookings"
                                        )
                                        .delete()
                                        .eq(
                                            "id",
                                            bookingId
                                        );


                                if (error) {

                                    console.error(
                                        "Delete error:",
                                        error
                                    );


                                    alert(
                                        "Failed to delete booking.\n\n" +
                                        error.message
                                    );

                                    return;

                                }


                                alert(
                                    "Booking deleted successfully!"
                                );


                                loadBookings();

                            }
                        );

                    }
                );


        }
        catch (error) {

            console.error(
                "Unexpected error:",
                error
            );


            bookingList.innerHTML = `

                <div class="alert alert-error">

                    <h3>
                        Something went wrong
                    </h3>

                    <p>
                        ${error.message}
                    </p>

                </div>

            `;

        }

    }


    // ========================================
    // START
    // ========================================

    loadBookings();


</script>


<script>

    function logout() {

        localStorage.removeItem("ss_role");

        window.location.href =
            "superadmin-login.html";

    }

</script>


</body>

</html>
