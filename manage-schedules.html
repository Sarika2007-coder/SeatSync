<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Schedules - SeatSync</title>

    <link rel="stylesheet"
          href="css/style.css">
    <link rel="stylesheet"
          href="css/superadmin.css">

</head>


<body>

<div class="dashboard">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="auth-logo">
            Seat<span>Sync</span>
        </div>

        <h3>Super Admin</h3>


        <nav>

            <a href="superadmin-dashboard.html">
                🏠 Dashboard
            </a>

            <a href="manage-admins.html">
                👨‍💼 Manage Admins
            </a>

            <a href="manage-users.html">
                👥 Manage Users
            </a>

            <a href="manage-buses.html">
                🚌 Manage Buses
            </a>

            <a href="manage-routes.html">
                🛣️ Manage Routes
            </a>

            <a href="manage-schedules.html">
                📅 Manage Schedules
            </a>

            <a href="manage-bookings.html">
                🎟️ Manage Bookings
            </a>

            <a href="revenue.html">
                💰 Revenue
            </a>

            <a href="activity-logs.html">
                📋 Activity Logs
            </a>

        </nav>


        <button
            onclick="logout()"
            class="btn-full">

            Logout

        </button>

    </aside>



    <!-- MAIN CONTENT -->

    <main class="dashboard-content">


        <div class="dashboard-header">

            <h1>
                Manage Schedules
            </h1>

            <p>
                Create and manage bus travel schedules.
            </p>

        </div>



        <!-- ADD SCHEDULE -->

        <section class="dashboard-section">

            <h2>
                Add New Schedule
            </h2>


            <form id="addScheduleForm">


                <!-- ROUTE -->

                <div class="form-group">

                    <label for="scheduleRoute">
                        Route
                    </label>

                    <select
                        id="scheduleRoute"
                        class="form-control"
                        required>

                        <option value="">
                            Loading routes...
                        </option>

                    </select>

                </div>



                <!-- BUS -->

                <div class="form-group">

                    <label for="scheduleBus">
                        Bus
                    </label>

                    <select
                        id="scheduleBus"
                        class="form-control"
                        required>

                        <option value="">
                            Select a route first
                        </option>

                    </select>

                </div>



                <!-- DATE -->

                <div class="form-group">

                    <label for="travelDate">
                        Travel Date
                    </label>

                    <input
                        type="date"
                        id="travelDate"
                        class="form-control"
                        required>

                </div>



                <!-- DEPARTURE -->

                <div class="form-group">

                    <label for="departureTime">
                        Departure Time
                    </label>

                    <input
                        type="time"
                        id="departureTime"
                        class="form-control"
                        required>

                </div>



                <!-- ARRIVAL -->

                <div class="form-group">

                    <label for="arrivalTime">
                        Arrival Time
                    </label>

                    <input
                        type="time"
                        id="arrivalTime"
                        class="form-control">

                </div>



                <button
                    type="submit"
                    class="btn-full">

                    Add Schedule

                </button>


            </form>

        </section>



        <!-- EXISTING SCHEDULES -->

        <section class="dashboard-section">

            <h2>
                Existing Schedules
            </h2>


            <div id="scheduleList">

                <p>
                    Loading schedules...
                </p>

            </div>

        </section>


    </main>

</div>



<!-- SUPABASE -->

<script src="js/env-config.js"></script>

<script
    type="module"
    src="js/supabase-client.js">
</script>

<script
    type="module"
    src="js/superadmin.js">
</script>


</body>

</html>
