function routeLabel(r) {
  if (!r) return '';
  return r.replace('-', ' → ').replace(/\b\w/g, c => c.toUpperCase());
}

// Returns true if this bus departure has already passed on the given date
function isDeparted(busTime, date) {
  const today = new Date().toISOString().split('T')[0];
  if (date !== today) return false;          // future dates: never expired
  const [time, period] = busTime.split(' ');
  let [h, m] = time.split(':').map(Number);
  if (period === 'PM' && h !== 12) h += 12;
  if (period === 'AM' && h === 12) h = 0;
  const dep  = new Date(); dep.setHours(h, m, 0, 0);
  return new Date() > dep;
}

function applyFilter() {
    const route = document.getElementById('routeFilter').value;
    const date = document.getElementById('dateFilter').value;
    const pass = parseInt(document.getElementById('passFilter').value);

    const routeSelect = document.getElementById('routeFilter');

    if (route) {
        const routeText =
            routeSelect.options[routeSelect.selectedIndex].text;

        const destination =
            routeText.split('→').pop().trim();

        showDestinationWeather(destination);
    }

    loadAndRenderBuses(route, date, pass);
}
async function loadAndRenderBuses(route, date, passengers) {
  if (!route) { renderBuses([], route, date, passengers); return; }
  const list = document.getElementById('busList');
  list.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><h3>Loading buses…</h3></div>';

  // Merge: hardcoded base data + admin-added buses from backend
  let buses = [...(BUS_DATA[route] || [])];
  try {
    const res  = await fetch('/api/buses/' + encodeURIComponent(route));
    const data = await res.json();
    if (data.success && data.buses.length) {
      // Add backend buses (avoid duplicates by name)
      const names = new Set(buses.map(b => b.name.toLowerCase()));
      data.buses.forEach(b => {
        if (!names.has(b.name.toLowerCase())) {
          buses.push({ id: b.id, name: b.name, type: b.type, time: b.time, duration: b.duration, seats: b.seats, price: b.price, rating: b.rating });
        }
      });
    }
  } catch (_) { /* backend unavailable — use hardcoded only */ }

  allLoadedBuses[route] = buses;
  renderBuses(buses, route, date, passengers);
}

function renderBuses(buses, route, date, passengers) {
  const list  = document.getElementById('busList');
  const title = document.getElementById('resultsTitle');
  const count = document.getElementById('resultsCount');

  if (!route) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>Select a Route</h3><p>Choose a route above to see available buses.</p></div>';
    title.textContent = 'Available Buses';
    count.textContent = '';
    return;
  }

  // buses is now passed in directly (merged hardcoded + backend)
  const active   = buses.filter(b => !isDeparted(b.time, date));
  const departed = buses.filter(b =>  isDeparted(b.time, date));

  title.textContent = routeLabel(route);
  count.textContent = active.length + ' bus' + (active.length !== 1 ? 'es' : '') + ' available';

  if (!active.length && !departed.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🚌</div><h3>No buses found</h3><p>Try a different route or date.</p></div>';
    return;
  }

  const renderCard = (b, expired) => {
    const avail = expired ? '❌ Departed'
      : b.seats > 10 ? `✅ ${b.seats} seats`
      : b.seats > 0  ? `⚠️ Only ${b.seats} left`
      : '❌ Full';
    const cls   = expired ? 'bus-avail low' : b.seats > 10 ? 'bus-avail' : 'bus-avail low';
    const stars = '⭐'.repeat(Math.floor(b.rating)) + (b.rating % 1 >= .5 ? '½' : '');
    const btn   = expired
      ? `<button class="btn-select" disabled style="background:var(--muted);cursor:not-allowed;">Departed</button>`
      : `<button class="btn-select" onclick="selectBus('${b.id}','${route}','${date}',${passengers})">Select →</button>`;
    return `
    <div class="bus-card" style="${expired ? 'opacity:.5;' : ''}">
      <div>
        <div class="bus-name">${b.name}</div>
        <div class="bus-type">${b.type}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:6px;">${stars} ${b.rating}</div>
      </div>
      <div>
        <div class="bus-time-big">${b.time}</div>
        <div class="bus-time-lbl">Departure</div>
      </div>
      <div>
        <div style="font-size:15px;font-weight:600;">${b.duration}</div>
        <div class="bus-time-lbl">Duration</div>
      </div>
      <div>
        <div class="${cls}">${avail}</div>
        <div class="bus-price-big" style="margin-top:4px;">₹${b.price}</div>
        <div class="bus-price-lbl">per seat</div>
      </div>
      ${btn}
    </div>`;
  };

  let html = active.map(b => renderCard(b, false)).join('');
  if (departed.length) {
    html += `<div style="margin:24px 0 12px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;">Departed buses (${departed.length})</div>`;
    html += departed.map(b => renderCard(b, true)).join('');
  }
  list.innerHTML = html;
}

function selectBus(busId, route, date, passengers) {
  let bus = null;
  const hardcoded = Object.values(BUS_DATA).flat();
  bus = hardcoded.find(b => b.id === busId);
  if (!bus && allLoadedBuses[route]) {
    bus = allLoadedBuses[route].find(b => b.id === busId);
  }
  if (!bus) return;
  const scheduleId = btoa(`${route}-${busId}-${date}`);
  sessionStorage.setItem('ss_selected_bus', JSON.stringify({ ...bus, route, date, passengers, scheduleId }));
  window.location.href = 'page3.html';
}

function deriveSlug(source, destination) {
  return source.toLowerCase().replace(/\s+/g, '-') + '-' + destination.toLowerCase().replace(/\s+/g, '-');
}

async function loadJourneyRoutes() {
  let apiRoutes = [];
  try {
    const res = await fetch('/api/routes');
    const data = await res.json();
    if (data.success && data.routes && data.routes.length) {
      apiRoutes = data.routes;
    }
  } catch (err) {
    console.error('API routes fetch failed, using fallback:', err);
  }

  routesData = apiRoutes.length ? apiRoutes : FALLBACK_ROUTES;

  const select = document.getElementById('journeyRoute');
  routesData.forEach(r => {
    const option = document.createElement('option');
    option.value = r.id;
    option.textContent = r.name;
    option.dataset.route = JSON.stringify(r);
    select.appendChild(option);
  });
}

async function onRouteSelected() {
  const select = document.getElementById('journeyRoute');
  const routeId = select.value;
  const boardingSelect = document.getElementById('journeyBoarding');
  const droppingSelect = document.getElementById('journeyDropping');
  const searchBtn = document.getElementById('searchButton');

  boardingSelect.innerHTML = '<option value="">— Select Boarding —</option>';
  droppingSelect.innerHTML = '<option value="">— Select Dropping —</option>';
  boardingSelect.disabled = true;
  droppingSelect.disabled = true;
  searchBtn.disabled = true;
  document.getElementById('journeyMsg').style.display = 'none';

  if (!routeId) return;

  const routeOption = select.options[select.selectedIndex];
  const routeInfo = JSON.parse(routeOption.dataset.route || '{}');
  const routeName = routeInfo.name || '';

  journeyStops = [];

  try {
    const res = await fetch('/api/routes/' + encodeURIComponent(routeId) + '/stops');
    const data = await res.json();
    if (data.success && data.stops && data.stops.length) {
      journeyStops = data.stops;
    }
  } catch (err) {
    console.log('Stops API unavailable, using fallback stops');
  }

  if (!journeyStops.length && FALLBACK_STOPS[routeName]) {
    journeyStops = FALLBACK_STOPS[routeName];
  }

  if (!journeyStops.length && routeInfo.origin && routeInfo.destination) {
    journeyStops = [
      { id: 'orig', name: routeInfo.origin, sequence: 1, arrival_time: '', departure_time: '' },
      { id: 'dest', name: routeInfo.destination, sequence: 2, arrival_time: '', departure_time: '' }
    ];
  }

  if (!journeyStops.length) {
    document.getElementById('journeyMsg').textContent = 'No stops found for this route.';
    document.getElementById('journeyMsg').style.display = 'block';
    return;
  }

  journeyStops.forEach(stop => {
    const option = document.createElement('option');
    option.value = JSON.stringify({ id: stop.id, sequence: stop.sequence, name: stop.name });
    option.textContent = stop.name + (stop.departure_time ? ' (' + stop.departure_time + ')' : '');
    boardingSelect.appendChild(option);
  });
  boardingSelect.disabled = false;
}

function onBoardingSelected() {
  const boardingSelect = document.getElementById('journeyBoarding');
  const droppingSelect = document.getElementById('journeyDropping');
  const searchBtn = document.getElementById('searchButton');
  const msgDiv = document.getElementById('journeyMsg');

  droppingSelect.innerHTML = '<option value="">— Select Dropping —</option>';
  searchBtn.disabled = true;
  msgDiv.style.display = 'none';

  if (!boardingSelect.value) { droppingSelect.disabled = true; return; }

  const boarding = JSON.parse(boardingSelect.value);
  let hasValidDrops = false;

  journeyStops.forEach(stop => {
    if (stop.sequence > boarding.sequence) {
      const option = document.createElement('option');
      option.value = JSON.stringify({ id: stop.id, sequence: stop.sequence, name: stop.name });
      option.textContent = stop.name + (stop.arrival_time ? ' (' + stop.arrival_time + ')' : '');
      droppingSelect.appendChild(option);
      hasValidDrops = true;
    }
  });

  droppingSelect.disabled = !hasValidDrops;

  if (!hasValidDrops) {
    msgDiv.className = 'auth-message error';
    msgDiv.textContent = 'No valid dropping points available after this boarding point.';
    msgDiv.style.display = 'block';
  }
}

function onDroppingSelected() {
  const routeId = document.getElementById('journeyRoute').value;
  const boarding = document.getElementById('journeyBoarding').value;
  const dropping = document.getElementById('journeyDropping').value;
  const msgDiv = document.getElementById('journeyMsg');

  if (boarding && dropping) {
    const boardingInfo = JSON.parse(boarding);
    const droppingInfo = JSON.parse(dropping);
    if (boardingInfo.sequence >= droppingInfo.sequence) {
      msgDiv.className = 'auth-message error';
      msgDiv.textContent = 'Please select a dropping point after the boarding point.';
      msgDiv.style.display = 'block';
      document.getElementById('searchButton').disabled = true;
      return;
    }
    msgDiv.style.display = 'none';
  }

  document.getElementById('searchButton').disabled = !(routeId && boarding && dropping);
}

function searchBuses() {
  const routeId = document.getElementById('journeyRoute').value;
  const boarding = document.getElementById('journeyBoarding').value;
  const dropping = document.getElementById('journeyDropping').value;
  const date = document.getElementById('dateFilter').value;
  const passengers = document.getElementById('passFilter').value;
  const msgDiv = document.getElementById('journeyMsg');

  if (!routeId || !boarding || !dropping) {
    alert('Please select route, boarding and dropping points.');
    return;
  }

  if (!date) {
    alert('Please select a travel date.');
    return;
  }

  const routeOption = document.getElementById('journeyRoute').options[document.getElementById('journeyRoute').selectedIndex];
  const routeInfo = JSON.parse(routeOption.dataset.route || '{}');
  const boardingInfo = JSON.parse(boarding);
  const droppingInfo = JSON.parse(dropping);

  if (boardingInfo.sequence >= droppingInfo.sequence) {
    alert('Please select a dropping point after the boarding point.');
    return;
  }

  const journey = {
    routeId: routeId,
    routeName: routeInfo.name || '',
    origin: routeInfo.origin || boardingInfo.name,
    destination: routeInfo.destination || droppingInfo.name,
    boardingStop: { id: boardingInfo.id, name: boardingInfo.name, sequence: boardingInfo.sequence },
    droppingStop: { id: droppingInfo.id, name: droppingInfo.name, sequence: droppingInfo.sequence },
    travelDate: date,
    passengers: parseInt(passengers)
  };
  sessionStorage.setItem('ss_selected_journey', JSON.stringify(journey));

  const slug = deriveSlug(routeInfo.origin || boardingInfo.name, routeInfo.destination || droppingInfo.name);

  sessionStorage.setItem('ss_route', slug);
  sessionStorage.setItem('ss_date', date);
  sessionStorage.setItem('ss_passengers', passengers);

  document.getElementById('routeFilter').value = slug;
  document.getElementById('dateFilter').value = date;
  document.getElementById('passFilter').value = passengers;

  msgDiv.style.display = 'none';
  loadAndRenderBuses(slug, date, parseInt(passengers));
}

// ── Init ──────────────────────────────────────────────────────
(function() {
  const date = new Date().toISOString().split('T')[0];
  document.getElementById('dateFilter').value = sessionStorage.getItem('ss_date') || date;
  const route = sessionStorage.getItem('ss_route') || '';
  const pass  = parseInt(sessionStorage.getItem('ss_passengers') || '1');
  if (route) {
    document.getElementById('routeFilter').value = route;
    document.getElementById('passFilter').value  = pass;
    loadAndRenderBuses(route, document.getElementById('dateFilter').value, pass);
  } else {
    renderBuses([], '', '', 1);
  }
  loadJourneyRoutes();
})();
async function showDestinationWeather(destination) {
    const weatherBox = document.getElementById('destinationWeather');

    const locationText = document.getElementById('weatherLocation');
    const temperatureText = document.getElementById('weatherTemperature');
    const conditionText = document.getElementById('weatherCondition');
    const windText = document.getElementById('weatherWind');

    weatherBox.style.display = 'block';

    locationText.textContent = `📍 Destination: ${destination}`;
    temperatureText.textContent = '🌡️ Loading...';
    conditionText.textContent = '☁️ Loading...';
    windText.textContent = '';

    try {
        const geoResponse = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(destination)}&count=1&language=en&format=json`
        );

        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
            throw new Error('Destination not found');
        }

        const location = geoData.results[0];

        const weatherResponse = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`
        );

        const weatherData = await weatherResponse.json();
        const current = weatherData.current;

        locationText.textContent =
            `📍 Destination: ${location.name}`;

        temperatureText.textContent =
            `🌡️ Temperature: ${current.temperature_2m}°C`;

        conditionText.textContent =
            `☁️ Condition: ${getWeatherCondition(current.weather_code)}`;

        windText.textContent =
            `💨 Wind Speed: ${current.wind_speed_10m} km/h`;

    } catch (error) {
        console.error('Weather error:', error);

        locationText.textContent =
            `📍 Destination: ${destination}`;

        temperatureText.textContent =
            '⚠️ Weather information unavailable';

        conditionText.textContent = '';
        windText.textContent = '';
    }
}

function getWeatherCondition(code) {
    if (code === 0) return '☀️ Clear Sky';

    if ([1, 2, 3].includes(code))
        return '🌤️ Partly Cloudy';

    if ([45, 48].includes(code))
        return '🌫️ Foggy';

    if ([51, 53, 55, 56, 57].includes(code))
        return '🌦️ Drizzle';

    if ([61, 63, 65, 66, 67].includes(code))
        return '🌧️ Rain';

    if ([71, 73, 75, 77].includes(code))
        return '❄️ Snow';

    if ([80, 81, 82].includes(code))
        return '🌧️ Rain Showers';

    if ([95, 96, 99].includes(code))
        return '⛈️ Thunderstorm';

    return '🌤️ Weather information available';
}
