<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeatSync - Select Seats</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a class="logo" href="user-dashboard.html">🚌 Seat<span>Sync</span></a>
  <ul class="nav-links">
    <li><a href="user-dashboard.html">Dashboard</a></li>
    <li><a href="page2.html">Find Buses</a></li>
  </ul>
</nav>

<div class="steps-bar">
  <div class="step done"><div class="step-num">✓</div><span class="step-label">Search</span></div>
  <div class="step-sep"></div>
  <div class="step done"><div class="step-num">✓</div><span class="step-label">Select Bus</span></div>
  <div class="step-sep"></div>
  <div class="step active"><div class="step-num">3</div><span class="step-label">Choose Seats</span></div>
  <div class="step-sep"></div>
  <div class="step"><div class="step-num">4</div><span class="step-label">Passenger Details</span></div>
  <div class="step-sep"></div>
  <div class="step"><div class="step-num">5</div><span class="step-label">Payment</span></div>
</div>

<div class="content-wrap">
  <div class="seat-page-wrap">

    <!-- Left: Seat layout -->
    <div>
      <div class="bus-front">
        <div>
          <div class="bus-front-label" id="routeName">Route</div>
          <div style="font-size:18px;font-weight:700;" id="busName">Bus</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:18px;font-weight:700;" id="busTime">Departure Time</div>
          <div style="font-size:13px;opacity:.7;" id="busPrice">Prices</div>
        </div>
        <div class="bus-front-icon">🚌</div>
      </div>

      <div class="seat-grid" id="seatGrid">
        <button class="seat available">A1</button>
        <button class="seat available">A2</button>
        <div class="seat aisle"></div>
        <button class="seat available">A3</button>
        <button class="seat available">A4</button>

        <button class="seat available">B1</button>
        <button class="seat available">B2</button>
        <div class="seat aisle"></div>
        <button class="seat available">B3</button>
        <button class="seat available">B4</button>

        <button class="seat available">C1</button>
        <button class="seat available">C2</button>
        <div class="seat aisle"></div>
        <button class="seat available">C3</button>
        <button class="seat available">C4</button>

        <button class="seat available">D1</button>
        <button class="seat available">D2</button>
        <div class="seat aisle"></div>
        <button class="seat available">D3</button>
        <button class="seat available">D4</button>

        <button class="seat available">E1</button>
        <button class="seat available">E2</button>
        <div class="seat aisle"></div>
        <button class="seat available">E3</button>
        <button class="seat available">E4</button>
      </div>

      <div class="seat-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#dbeafe;border:1.5px solid #bfdbfe;"></div> Available</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--success);"></div> Selected</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fee2e2;"></div> Booked</div>
      </div>
    </div>

    <!-- Right: Summary -->
    <div class="card summary-card">
      <h3>Booking Summary</h3>
      <div class="summary-row"><span class="lbl">Selected Seats</span><span class="val" id="selectedSeats">None</span></div>
      <div class="seat-chips" id="seatChips"></div>
      <div class="summary-total"><span>Total</span><span class="val">₹<span id="totalPrice">0</span></span></div>
      <button class="btn-full" id="continueBtn" style="margin-top:20px;">Continue →</button>
    </div>

  </div>
</div>

<footer><strong>SeatSync</strong> &copy; 2024</footer>

<script src="js/env-config.js"></script>
<script type="module" src="js/supabase-client.js" defer></script>
<script defer>

    // ==========================================
    // GET BUS INFORMATION
    // ==========================================

    const params = new URLSearchParams(window.location.search);

    let selectedRoute = params.get("route");
    let selectedBus = params.get("bus");
    let selectedTime = params.get("time");
    let selectedPrice = params.get("price");
    let busType = params.get("busType") || "";
    let travelDate = params.get("date") || new Date().toISOString().split('T')[0];

    // Fallback: read from sessionStorage (set by page2 selectBus)
    if (!selectedRoute) {
        const stored = JSON.parse(sessionStorage.getItem('ss_selected_bus') || 'null');
        if (stored) {
            selectedRoute = stored.route;
            selectedBus = stored.name;
            selectedTime = stored.time;
            selectedPrice = '₹' + stored.price;
            busType = stored.type || '';
            travelDate = stored.date || travelDate;
        }
    }


    // ==========================================
    // DISPLAY BUS INFORMATION
    // ==========================================

    document.getElementById("routeName").textContent =
        selectedRoute
            ? selectedRoute.replace("-", " → ")
            : "Route not available";

    document.getElementById("busName").textContent =
        selectedBus || "Bus not available";

    document.getElementById("busTime").textContent =
        selectedTime
            ? "Departure: " + selectedTime
            : "Time not available";

    document.getElementById("busPrice").textContent =
        selectedPrice
            ? "Price: " + selectedPrice
            : "Price not available";


    // ==========================================
    // SEAT ELEMENTS
    // ==========================================

    const allSeats = document.querySelectorAll(".seat:not(.aisle)");

    const selectedSeatsDisplay =
        document.getElementById("selectedSeats");

    const seatChips =
        document.getElementById("seatChips");

    const totalPrice =
        document.getElementById("totalPrice");

    const seatPrice =
        selectedPrice
            ? parseInt(selectedPrice.replace("₹", ""))
            : 0;

    let selected = [];


    // ==========================================
    // LOAD ALREADY BOOKED SEATS
    // ==========================================

    async function loadBookedSeats() {
        if (!window.supabase || !selectedBus) return;

        try {
            const { data, error } = await window.supabase
                .from('bookings')
                .select('seats')
                .eq('route', selectedRoute)
                .eq('bus_name', selectedBus)
                .eq('time', selectedTime)
                .eq('date', travelDate)
                .neq('status', 'cancelled');

            if (error) {
                console.error('Error loading booked seats from Supabase:', error);
                return;
            }

            let bookedSeats = [];
            data.forEach(booking => {
                if (booking.seats) {
                    const seats = booking.seats.split(',').map(s => s.trim());
                    bookedSeats.push(...seats);
                }
            });

            allSeats.forEach(seat => {
                const seatNumber = seat.textContent.trim();
                if (bookedSeats.includes(seatNumber)) {
                    seat.classList.remove('available');
                    seat.classList.remove('selected');
                    seat.classList.add('booked');
                    seat.disabled = true;
                }
            });

        } catch (error) {
            console.error('Could not load booked seats:', error);
        }
    }

    loadBookedSeats();


    // ==========================================
    // SELECT AVAILABLE SEATS
    // ==========================================

    allSeats.forEach(seat => {
        seat.addEventListener("click", () => {
            if (seat.classList.contains("booked")) return;

            const seatNumber = seat.textContent.trim();

            if (seat.classList.contains("selected")) {
                seat.classList.remove("selected");
                seat.classList.add("available");
                selected = selected.filter(item => item !== seatNumber);
            } else {
                seat.classList.remove("available");
                seat.classList.add("selected");
                selected.push(seatNumber);
            }

            if (selected.length === 0) {
                selectedSeatsDisplay.textContent = "None";
            } else {
                selectedSeatsDisplay.textContent = selected.join(", ");
            }

            // Update seat chips
            seatChips.innerHTML = selected
                .map(s => '<span class="seat-chip">' + s + '</span>')
                .join('');

            totalPrice.textContent = selected.length * seatPrice;
        });
    });


    // ==========================================
    // CONTINUE TO PAGE 4
    // ==========================================

    document
        .getElementById("continueBtn")
        .addEventListener("click", function () {
            if (selected.length === 0) {
                alert("Please select at least one seat.");
                return;
            }

            const seats = selected.join(",");

            const page4URL =
                "page4.html" +
                "?route=" + encodeURIComponent(selectedRoute) +
                "&bus=" + encodeURIComponent(selectedBus) +
                "&time=" + encodeURIComponent(selectedTime) +
                "&price=" + encodeURIComponent(selectedPrice) +
                "&seats=" + encodeURIComponent(seats) +
                "&busType=" + encodeURIComponent(busType) +
                "&date=" + encodeURIComponent(travelDate);

            window.location.href = page4URL;
        });

</script>

</body>
</html>
