<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeatSync - Passenger Details</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .booking-info { line-height: 1.8; font-size: 17px; }
        .booking-info p { border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        .booking-info strong { display: inline-block; width: 170px; }
        .total { font-size: 22px; font-weight: bold; text-align: center; margin-top: 25px; }
        .confirm-btn {
            width: 100%; padding: 15px; background: var(--accent); color: white;
            border: none; border-radius: 12px; font-size: 17px; font-weight: bold;
            cursor: pointer; font-family: inherit;
        }
        .confirm-btn:hover { background: var(--accent-h); }
    </style>
</head>
<body>

<nav class="navbar">
  <a class="logo" href="user-dashboard.html">🚌 Seat<span>Sync</span></a>
  <ul class="nav-links">
    <li><a href="user-dashboard.html">Dashboard</a></li>
    <li><a href="page2.html">Find Buses</a></li>
  </ul>
</nav>

<div class="steps-bar">
  <div class="step done"><div class="step-num">✓</div><span class="step-label">Search</span></div>
  <div class="step-sep"></div>
  <div class="step done"><div class="step-num">✓</div><span class="step-label">Select Bus</span></div>
  <div class="step-sep"></div>
  <div class="step done"><div class="step-num">✓</div><span class="step-label">Choose Seats</span></div>
  <div class="step-sep"></div>
  <div class="step active"><div class="step-num">4</div><span class="step-label">Passenger Details</span></div>
  <div class="step-sep"></div>
  <div class="step"><div class="step-num">5</div><span class="step-label">Payment</span></div>
</div>

<div class="content-wrap">

    <!-- Booking Summary -->
    <div class="card">
        <h2>Booking Summary</h2>
        <div class="booking-info">
            <p><strong>Route:</strong> <span id="routeName">Loading...</span></p>
            <p><strong>Bus:</strong> <span id="busName">Loading...</span></p>
            <p><strong>Departure:</strong> <span id="busTime">Loading...</span></p>
            <p><strong>Selected Seats:</strong> <span id="seatNumbers">Loading...</span></p>
            <p><strong>Price per Seat:</strong> <span id="seatPrice">Loading...</span></p>
        </div>
        <div class="total">
            Total Price: <span id="totalPrice">₹0</span>
        </div>
    </div>

    <!-- Passenger Details -->
    <div class="card">
        <h2>Passenger Details</h2>
        <div class="form-group">
            <label for="passengerName">Full Name</label>
            <input type="text" id="passengerName" class="form-control" placeholder="Enter passenger name">
        </div>
        <div class="form-group">
            <label for="mobileNumber">Mobile Number</label>
            <input type="tel" id="mobileNumber" class="form-control" placeholder="Enter mobile number">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email address">
        </div>
        <button class="confirm-btn" id="confirmBtn">Continue to Payment →</button>
    </div>

</div>

<footer><strong>SeatSync</strong> &copy; 2024</footer>

<script src="js/env-config.js"></script>
<script type="module" src="js/supabase-client.js" defer></script>
<script defer>

    // ==========================================
    // PARSE URL PARAMETERS
    // ==========================================

    const params = new URLSearchParams(window.location.search);
    const selectedRoute = params.get("route") || "";
    const selectedBus = params.get("bus") || "";
    const selectedTime = params.get("time") || "";
    const selectedPrice = params.get("price") || "";
    const seatsParam = params.get("seats") || "";
    const busType = params.get("busType") || "";
    const travelDate = params.get("date") || new Date().toISOString().split('T')[0];

    const seats = seatsParam ? seatsParam.split(",") : [];

    const priceNumber = selectedPrice
        ? parseInt(selectedPrice.replace("₹", ""))
        : 0;

    const total = seats.length * priceNumber;
    const tax = Math.round(total * 0.05);
    const grandTotal = total + tax;


    // ==========================================
    // ENSURE LOGGED-IN USER
    // ==========================================

    async function ensureLoggedInUser() {
        if (!window.supabaseAuth) return null;

        const session = await window.supabaseAuth.getSession();
        const user = session?.user;

        if (!user) {
            window.location.href = 'user-login.html';
            return null;
        }

        const emailInput = document.getElementById('email');
        if (emailInput && user.email) {
            emailInput.value = user.email;
        }

        return user;
    }

    ensureLoggedInUser();


    // ==========================================
    // DISPLAY BOOKING SUMMARY
    // ==========================================

    document.getElementById("routeName").textContent =
        selectedRoute ? selectedRoute.replace("-", " → ") : "Not available";

    document.getElementById("busName").textContent =
        selectedBus || "Not available";

    document.getElementById("busTime").textContent =
        selectedTime || "Not available";

    document.getElementById("seatNumbers").textContent =
        seats.length > 0 ? seats.join(", ") : "No seats selected";

    document.getElementById("seatPrice").textContent =
        selectedPrice || "₹0";

    document.getElementById("totalPrice").textContent = "₹" + grandTotal;


    // ==========================================
    // CONFIRM → STORE & REDIRECT TO PAYMENT
    // ==========================================

    document
        .getElementById("confirmBtn")
        .addEventListener("click", async function () {

            const name = document.getElementById("passengerName").value.trim();
            const mobile = document.getElementById("mobileNumber").value.trim();
            const email = document.getElementById("email").value.trim();

            if (!name || !mobile || !email) {
                alert("Please fill in all passenger details.");
                return;
            }

            // Build the ss_booking object that payment.html expects
            const ssBooking = {
                name: selectedBus,
                type: busType,
                route: selectedRoute,
                date: travelDate,
                time: selectedTime,
                selectedSeats: seats,
                totalAmount: total,
                tax: tax,
                grandTotal: grandTotal,
                contactEmail: email,
                contactPhone: mobile,
                passengers: []
            };

            sessionStorage.setItem('ss_booking', JSON.stringify(ssBooking));
            window.location.href = 'payment.html';
        });

</script>

</body>
</html>
