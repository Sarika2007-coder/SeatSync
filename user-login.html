<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login – SeatSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">🚌 Seat<span>Sync</span></div>
    <h2 id="authTitle">Welcome Back</h2>
    <p class="auth-sub" id="authSub">Sign in to book your bus tickets</p>

    <div id="authMsg" class="auth-message" style="display:none;"></div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="userEmail" class="form-control" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="userPassword" class="form-control" placeholder="Enter your password" required>
          <button type="button" class="toggle-pw" onclick="togglePw('userPassword',this)">👁</button>
        </div>
      </div>

      <div id="confirmRow" class="form-group" style="display:none;">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password">
          <button type="button" class="toggle-pw" onclick="togglePw('confirmPassword',this)">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-full" id="authBtn">Sign In</button>
    </form>

    <div class="auth-toggle">
      <span id="toggleText">Don't have an account?</span>
      <a id="toggleLink" onclick="setMode(!isSignup)">Create one</a>
    </div>
    <a href="index.html" class="auth-back">← Back to Home</a>
  </div>
</div>

<script src="/js/env-config.js"></script>
<script type="module" src="js/supabase-client.js" defer></script>
<script src="js/login.js" defer></script>
<script>
  function togglePw(id, btn) {
    const el = document.getElementById(id);
    if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
    else { el.type = 'password'; btn.textContent = '👁'; }
  }
</script>
</body>
</html>
