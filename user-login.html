<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - SeatSync</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>SeatSync</h1>
            <h2>User Login</h2>

            <p>Login to book your bus seat</p>

            <form id="authForm" onsubmit="handleAuthSubmit(event)">

                <label>Email</label>
                <input
                    type="email"
                    id="userEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="userPassword"
                    placeholder="Enter your password"
                    required
                >

                <div id="confirmPasswordRow" style="display:none;">
                    <label>Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                    >
                </div>

                <button type="submit" class="login-btn" id="authButton">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p style="margin-top: 16px; font-size: 14px; color: #4b5563;">
                <span id="authToggleText">Don't have an account?</span>
                <button type="button" id="toggleAuthMode" style="background:none;border:none;color:#2563eb;cursor:pointer;padding:0;">
                    Create one
                </button>
            </p>

            <a href="index.html">← Back to Home</a>

        </div>

    </div>

    <script src="/js/env-config.js"></script>
    <script type="module" src="js/supabase-client.js" defer></script>
    <script src="js/login.js" defer></script>

</body>
</html>
