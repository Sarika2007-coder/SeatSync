<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - SeatSync</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">🚌 Seat<span>Sync</span></div>
    <h2>User Login</h2>
    <p class="auth-sub">Sign in to book your bus seat</p>

    <div id="loginMessage" class="auth-message" style="display:none;"></div>

    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="userEmail" class="form-control" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="userPassword" class="form-control" placeholder="Enter your password" required>
      </div>
      <div id="confirmPasswordRow" style="display:none;">
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password">
        </div>
      </div>
      <button type="submit" class="btn-full" id="authButton">Login</button>
    </form>

    <p class="auth-toggle">
      <span id="authToggleText">Don't have an account?</span>
      <a id="toggleAuthMode">Create one</a>
    </p>

    <a href="index.html" class="auth-back">← Back to Home</a>
  </div>
</div>

<script src="js/env-config.js"></script>
<script type="module" src="js/supabase-client.js" defer></script>
<script src="js/login.js" defer></script>
</body>
</html>
